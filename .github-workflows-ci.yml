name: quality-gates
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test, POSTGRES_USER: qs, POSTGRES_DB: qs }
        ports: ['5432:5432']
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: '.nvmrc', cache: npm }
      - run: npm ci
      - run: npm run migrate
        env: { DATABASE_URL: postgres://qs:test@127.0.0.1:5432/qs, WEB_ORIGIN: http://127.0.0.1:5173, REDIS_URL: redis://127.0.0.1:6379, CSRF_SECRET: test-secret-with-at-least-32-bytes-x, PASSWORD_PEPPER: test-pepper-with-at-least-32-bytes }
      - run: npm run verify
      - run: npm run audit:prod
      - run: npm run sbom
